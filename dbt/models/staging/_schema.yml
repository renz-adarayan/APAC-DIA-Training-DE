
version: 1

models:
  - name: stg_customers
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: natural_key
        tests:
          - unique
          - not_null
      - name: email_normalized
      - name: is_email_valid
        tests:
          - accepted_values:
              values: [true, false]
      - name: latitude
        tests:
          - latitude_range
      - name: longitude
        tests:
          - longitude_range

  - name: stg_products
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: sku
      - name: product_name
      - name: current_price
      - name: category
        tests:
          - accepted_values:
              values: ['apparel', 'beauty', 'electronics', 'home', 'sports']
      - name: subcategory
        tests:
          - accepted_values:
              values: ['audio', 'decor', 'fitness', 'furniture', 'gaming', 'hair', 'kids', 'kitchen', 'laptops', 'makeup', 'mens', 'outdoor', 'phones', 'skincare', 'team', 'womens']

  - name: stg_stores
    columns:
      - name: store_id
        tests:
          - unique
          - not_null
      - name: store_code
      - name: store_name
      - name: latitude
        tests:
          - latitude_range
      - name: longitude
        tests:
          - longitude_range
      - name: channel
        tests:
          - accepted_values:
              values: ['web', 'pos']
      - name: region
      - name: state
      - name: open_dt
      - name: close_dt
      - name: src_filename
      - name: src_row_hash
      - name: ingestion_ts

  - name: stg_suppliers
    columns:
      - name: supplier_id
        tests:
          - unique
          - not_null
      - name: supplier_code
      - name: is_preferred
        tests:
          - accepted_values:
              values: [true, false]
      - name: name

  - name: stg_orders_header
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: store_id
        tests:
          - relationships:
              to: ref('stg_stores')
              field: store_id
      - name: channel
      - name: order_value_tier
        tests:
          - accepted_values:
              values: ['high_value', 'medium_value', 'low_value']

  - name: stg_orders_lines
    columns:
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders_header')
              field: order_id
      - name: line_number
        tests:
          - not_null
      - name: product_id
        tests:
          - relationships:
              to: ref('stg_products')
              field: product_id
      - name: order_line_business_key
        tests:
          - unique
          - not_null
      - name: line_discount_pct
        tests:
          - discount_percentage
      - name: unit_price

  - name: stg_events
    columns:
      - name: event_id
        tests:
          - unique

  - name: stg_sensors
    columns:
      - name: sensor_ts_utc
        tests:
          - not_null
      - name: store_id
        tests:
          - relationships:
              to: ref('stg_stores')
              field: store_id
      - name: shelf_id

  - name: stg_exchange_rates
    columns:
      - name: currency_code
        tests:
          - not_null
      - name: rate_date
        tests:
          - not_null

  - name: stg_shipments
    columns:
      - name: shipment_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - relationships:
              to: ref('stg_orders_header')
              field: order_id

  - name: stg_returns
    columns:
      - name: return_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - relationships:
              to: ref('stg_orders_header')
              field: order_id
      - name: product_id
        tests:
          - relationships:
              to: ref('stg_products')
              field: product_id
