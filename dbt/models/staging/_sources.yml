version: 1

sources:
  - name: bronze
    schema: main
    freshness:
      warn_after: {count: 12, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: customers
        identifier: bronze_customers
        tags: ['bronze_source']
        loaded_at_field: ingestion_ts
        columns:
          - name: customer_id
          - name: natural_key
          - name: first_name
          - name: last_name
          - name: email
          - name: phone
          - name: birth_date
          - name: address_line1
          - name: address_line2
          - name: city
          - name: state_region
          - name: postcode
          - name: country_code
          - name: latitude
          - name: longitude
          - name: join_ts
          - name: is_vip
          - name: gdpr_consent
          - name: src_filename
          - name: src_row_hash
          - name: ingestion_ts
      - name: products
        identifier: bronze_products
        tags: ['bronze_source']
        loaded_at_field: ingestion_ts
        columns:
          - name: product_id
          - name: sku
          - name: name
          - name: category
          - name: subcategory
          - name: current_price
          - name: currency
          - name: introduced_dt
          - name: discontinued_dt
          - name: is_discontinued
          - name: src_filename
          - name: src_row_hash
          - name: ingestion_ts
      - name: stores
        identifier: bronze_stores
        tags: ['bronze_source']
        loaded_at_field: ingestion_ts
        columns:
          - name: store_id
          - name: store_code
          - name: name
          - name: channel
          - name: region
          - name: state
          - name: latitude
          - name: longitude
          - name: open_dt
          - name: close_dt
          - name: src_filename
          - name: src_row_hash
          - name: ingestion_ts
      - name: suppliers
        identifier: bronze_suppliers
        tags: ['bronze_source']
        loaded_at_field: ingestion_ts
        columns:
          - name: supplier_id
          - name: supplier_code
          - name: name
          - name: country_code
          - name: lead_time_days
          - name: preferred
          - name: src_filename
          - name: src_row_hash
          - name: ingestion_ts
      - name: orders_header
        identifier: bronze_orders_header
        tags: ['bronze_source']
        loaded_at_field: ingestion_ts
        columns:
          - name: order_id
          - name: order_dt
          - name: order_ts
          - name: order_dt_local
          - name: customer_id
          - name: store_id
          - name: channel
          - name: payment_method
          - name: coupon_code
          - name: shipping_fee
          - name: currency
          - name: src_filename
          - name: src_row_hash
          - name: ingestion_ts
      - name: orders_lines
        identifier: bronze_orders_lines
        tags: ['bronze_source']
        loaded_at_field: ingestion_ts
        columns:
          - name: order_id
          - name: line_number
          - name: product_id
          - name: qty
          - name: unit_price
          - name: line_discount_pct
          - name: tax_pct
          - name: src_filename
          - name: src_row_hash
          - name: ingestion_ts
      - name: events
        identifier: bronze_events
        tags: ['bronze_source']
        loaded_at_field: ingestion_ts
        columns:
          - name: event_id
          - name: event_ts
          - name: event_type
          - name: user_id
          - name: session_id
          - name: payload
          - name: src_filename
          - name: src_row_hash
          - name: ingestion_ts
      - name: sensors
        identifier: bronze_sensors
        tags: ['bronze_source']
        loaded_at_field: ingestion_ts
        columns:
          - name: sensor_ts
          - name: store_id
          - name: shelf_id
          - name: temperature_c
          - name: humidity_pct
          - name: battery_mv
          - name: src_filename
          - name: src_row_hash
          - name: ingestion_ts
      - name: exchange_rates
        identifier: bronze_exchange_rates
        tags: ['bronze_source']
        loaded_at_field: ingestion_ts
        columns:
          - name: date
          - name: currency
          - name: rate_to_aud
          - name: src_filename
          - name: src_row_hash
          - name: ingestion_ts
      - name: shipments
        identifier: bronze_shipments
        tags: ['bronze_source']
        loaded_at_field: ingestion_ts
        columns:
          - name: shipment_id
          - name: order_id
          - name: carrier
          - name: shipped_at
          - name: delivered_at
          - name: ship_cost
          - name: src_filename
          - name: src_row_hash
          - name: ingestion_ts
      - name: returns
        identifier: bronze_returns
        tags: ['bronze_source']
        loaded_at_field: ingestion_ts
        columns:
          - name: return_id
          - name: order_id
          - name: product_id
          - name: return_ts
          - name: qty
          - name: reason
          - name: return_reason_code
          - name: src_filename
          - name: src_row_hash
          - name: ingestion_ts
